name: Build and test Easy VLESS

on:
  pull_request:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 python3-yaml
      - run: python3 tests/ci/workflow-events.py
      - run: bash tests/static-checks.sh
        env:
          STATIC_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD' }}

  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        release: [24.10.3, 25.12.6]
        include:
          - release: 24.10.3
            channel: ipk
          - release: 25.12.6
            channel: apk
        target: [x86/64, mediatek/filogic]
    env:
      OPENWRT_RELEASE: ${{ matrix.release }}
      OPENWRT_TARGET: ${{ matrix.target }}
      CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SDK tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file gawk gettext libncurses-dev libssl-dev python3 rsync unzip zstd
      - name: Download and verify the official SDK
        run: |
          set -euo pipefail
          base="https://downloads.openwrt.org/releases/$OPENWRT_RELEASE/targets/$OPENWRT_TARGET"
          curl -fsSLO "$base/sha256sums"
          awk '$2 ~ /openwrt-sdk-.*\.tar\.(xz|zst)$/ { print }' sha256sums > sdk.sha256
          test "$(wc -l < sdk.sha256)" -eq 1
          sdk_file="$(awk '{sub(/^\*/, "", $2); print $2}' sdk.sha256)"
          curl --retry 3 -fsSLO "$base/$sdk_file"
          sha256sum -c sdk.sha256
          mkdir sdk
          tar -xf "$sdk_file" -C sdk --strip-components=1
      - name: Build and verify packages
        id: build
        run: |
          set -euo pipefail
          bash scripts/sdk-build.sh --feeds sdk out
          case "$OPENWRT_TARGET" in
            mediatek/filogic) arch=aarch64_cortex-a53 ;;
            x86/64) arch=x86_64 ;;
          esac
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
          if [ "$CHANNEL" = apk ]; then
            bash tests/apk-package-check.sh out "$PWD/sdk/staging_dir/host/bin/apk"
          fi
          bash tests/core-package-check.sh out/sing-box-lx*."$CHANNEL" "$arch" "$PWD/sdk/staging_dir/host/bin/apk"
          cp scripts/install.sh out/
          (cd out && sha256sum * > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Sign disposable APKs for runtime CI
        if: matrix.channel == 'apk'
        run: |
          set -euo pipefail
          umask 077
          keys=$(mktemp -d)
          trap 'rm -rf "$keys"' EXIT
          apk="$PWD/sdk/staging_dir/host/bin/apk"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$keys/ci-only.rsa"
          mkdir -p "$keys/root/etc/apk/keys"
          openssl pkey -in "$keys/ci-only.rsa" -pubout -out out/easy-vless-ci-test.pem
          cp out/easy-vless-ci-test.pem "$keys/root/etc/apk/keys/"
          for file in out/*.apk; do
            "$apk" adbsign --allow-untrusted --reset-signatures --sign-key "$keys/ci-only.rsa" "$file"
            "$apk" --root "$keys/root" verify "$file"
          done
          (cd out && rm SHA256SUMS && sha256sum * > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: ci-packages-${{ matrix.channel }}-${{ steps.build.outputs.arch }}
          path: out/
          if-no-files-found: error

  runtime:
    runs-on: ubuntu-24.04
    needs: [packages]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: ipk
            release: 24.10.3
          - channel: apk
            release: 25.12.6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-packages-${{ matrix.channel }}-x86_64
          path: dist
      - name: Stage the previous release for a rollback test
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -euo pipefail
          url=https://github.com/quargelk/easy-vless/releases/download/v1.2.0
          mkdir previous
          cd previous
          curl --retry 3 -fsSLO "$url/SHA256SUMS"
          for package in easy-vless easy-vless-sing-box luci-app-easy-vless; do
            if [ "$CHANNEL" = ipk ]; then
              file="${package}_1.2.0-r1_all.ipk"
            else
              file="${package}-1.2.0-r1.apk"
            fi
            curl --retry 3 -fsSLO "$url/$file"
            awk -v f="$file" '$2 == f { print; n++ } END { if (n != 1) exit 1 }' SHA256SUMS > asset.sha256
            sha256sum -c asset.sha256
          done
      - name: Install packages and run backend tests in OpenWrt
        env:
          CHANNEL: ${{ matrix.channel }}
          RELEASE: ${{ matrix.release }}
        run: |
          docker run --rm --memory=256m --cap-add=NET_ADMIN -v "$PWD:/w:ro" \
            -e EV_CI_CHANNEL="$CHANNEL" -e EV_CI_NET_ADMIN=1 -e EV_OLD_BUNDLE=/w/previous \
            "openwrt/rootfs:x86-64-$RELEASE" /bin/ash /w/tests/ci/lx-runtime-tests.sh
