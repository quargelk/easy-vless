name: Build easy-vless packages

# Events (tests/ci/workflow-events.py checks this separation):
#   pull request, workflow_dispatch  full CI: all jobs below except release
#   push to main                     checks and build (post-merge build; the
#                                    merged tree passed the full CI in its PR)
#   push of a v* tag                 release pipeline: checks, build, release;
#                                    release requires a successful full CI
#                                    run for the same tree
#
# Jobs:
#   checks         static checks (tests/static-checks.sh): shell/Lua/JS/JSON
#                  syntax, git whitespace, resources, screenshots, package
#                  metadata, local-path/credential scan; the event separation
#                  of this workflow (tests/ci/workflow-events.py)
#   build          real OpenWrt 24.10.3 mediatek/filogic SDK build of all
#                  packages, per-package content checks, dist/ + SHA256SUMS
#   runtime-tests  matrix of real OpenWrt rootfs images (x86-64 24.10.3 and
#                  24.10.8, armsr-armv8 aarch64, armsr-armv7 and mvebu
#                  cortex-a9 ARMv7, malta-be MIPS big-endian; non-x86 through
#                  QEMU user emulation): scripts/install.sh with the built
#                  packages, tests/subscription-formats-test.sh, installer,
#                  system requirement and bootstrap scenarios
#                  (tests/ci/installer-tests.sh); First Run Wizard backend
#                  (ubus) on every target and the LuCI wizard in headless
#                  Chromium on x86-64 (tests/ci/wizard-tests.sh); pull
#                  requests and workflow_dispatch only
#   ubifs          real kernel flash stack (nandsim NAND, UBI, UBIFS) with
#                  the TR3000 v1 layout: flash detection, UBIFS compression
#                  of a worst-case installation (tests/ci/ubifs-tests.sh);
#                  pull requests and workflow_dispatch only
#   release        only for tags v*: requires a successful full CI run of
#                  this workflow for the tree of the tagged commit (checks,
#                  build, every runtime-tests job, ubifs), then the draft GitHub Release
#                  with the dist/ files of this run's build (the tag/version
#                  check is in build; the only job with contents: write)
#
# Reproducible package build for the Easy VLESS runtime, split into OpenWrt
# packages (backend-dependency split):
#   - easy-vless             (core runtime, no VLESS engine)
#   - easy-vless-sing-box    (sing-box backend, DEPENDS:=+easy-vless sing-box)
#   - easy-vless-xray        (Xray backend, DEPENDS:=+easy-vless xray-core)
#   - luci-app-easy-vless    (LuCI UI, DEPENDS:=+easy-vless +luci-base +rpcd)
#   - easy-vless-geodata     (optional meta package: geoview + v2ray-geoip/-geosite)
# ("sing-box"/"xray-core" are intentionally not "+"-prefixed - see the
# Makefile comments on those two DEPENDS lines for the Kconfig-cycle reason.)
# All three are defined as sub-packages of the same Makefile/source tree
# (package/easy-vless in the SDK).
#
# Build mechanism (audited/changed - see "Build" step below for the full
# rationale): the build step invokes `make -C package/easy-vless ... compile`
# directly, NOT the usual top-level `make package/easy-vless/compile`. The
# top-level form goes through package/Makefile's directory-tree walk, which
# includes an auto-generated tmp/.packagedeps file that adds every one of our
# DEPENDS entries (sing-box, xray-core, curl, nftables, kmod-nft-*, ...) as an
# UNCONDITIONAL compile-time prerequisite of our own package's compile target
# - by OpenWrt design, DEPENDS drives build-ordering as well as opkg runtime
# dependencies. That is what made earlier CI runs spend 20-30+ minutes
# building kmod-tcp-bbr/kmod-tcp-hybla/curl/sing-box/xray-core/etc., none of
# which we need to actually compile (all three of our packages are
# PKGARCH:=all shell/Lua/config, no compiled binaries of our own).
# `tmp/.packagedeps` is only ever `include`d by that top-level directory-tree
# walk, never by a package Makefile invoked standalone via `make -C
# package/<name>` - so invoking our own Makefile that way still runs the
# genuine, unmodified OpenWrt `package.mk`/`package-pack.mk`/`ipkg-build`
# packaging machinery (real, opkg-installable .ipk - not a renamed tarball)
# while never touching sing-box/xray-core/kmod-*/curl's own build steps.
# Verified directly against a real (non-DUMP) OpenWrt 24.10.3 package.mk/
# package-pack.mk, offline, using the actual scripts/ipkg-build.
#
# Package feeds used (verified directly against the pinned feed commits for
# OpenWrt 24.10.3, not assumed):
#   - sing-box, xray-core, v2ray-geoip, v2ray-geosite, lyaml, openssl-util,
#     kmod-nft-* etc. all come from the OFFICIAL feeds already declared in
#     the SDK's feeds.conf.default (packages/luci/routing/telephony) - no
#     third-party feed needed for these.
#   - geoview does NOT exist in any official feed (confirmed via
#     `git grep -il geoview` against the pinned packages/luci feed commits -
#     zero matches). It is only available from the third-party
#     xiaorouji/openwrt-passwall-packages feed, pinned to a specific commit
#     below. Only geoview is installed from that feed - sing-box/xray-core
#     are deliberately taken from the official feed, not this one, to avoid
#     pulling in unrelated/duplicate package definitions.
#
# Builds against the OFFICIAL OpenWrt 24.10.3 SDK for mediatek/filogic
# (aarch64_cortex-a53). Does not clone the full OpenWrt source tree and
# does not use any third-party/self-built toolchain for the SDK itself -
# GitHub Actions is the canonical build environment for the release packages.

on:
  push:
    branches: [main]
    # Path filters are not applied to tag pushes: every v* tag builds.
    tags: ['v*']
    paths:
      - 'Makefile'
      - 'files/**'
      - 'root/**'
      - 'luci/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/images/**'
      - 'reference/**'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'Makefile'
      - 'files/**'
      - 'root/**'
      - 'luci/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/images/**'
      - 'reference/**'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.github/workflows/build.yml'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  OPENWRT_VERSION: "24.10.3"
  OPENWRT_TARGET: mediatek
  OPENWRT_SUBTARGET: filogic
  # Expected OpenWrt package architecture for this target/subtarget, used to
  # confirm each .ipk lands in the right SDK output tree. All three packages'
  # own control-file "Architecture:" field is "all" (see the verification
  # step below for why - PKGARCH:=all is correct here, not a bug).
  EXPECTED_PKGARCH: aarch64_cortex-a53
  # Third-party feed providing geoview (not present in any official feed -
  # verified, see header comment). Pinned to the exact commit read while
  # confirming geoview/Makefile's contents, for reproducibility.
  PASSWALL_PACKAGES_FEED_URL: https://github.com/xiaorouji/openwrt-passwall-packages.git
  PASSWALL_PACKAGES_FEED_COMMIT: 8809eaf16367a7315620f1373aed3403bbc52eb0

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout easy-vless
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install check tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1 python3-yaml

      - name: CI event separation (pull request = full CI, main = build, tag = release only)
        run: python3 tests/ci/workflow-events.py .github/workflows/build.yml

      - name: Static checks
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Whitespace is checked on the lines this push / pull request changes.
          base=""
          if [ -n "${PR_BASE}" ]; then base="${PR_BASE}"
          elif [ -n "${EVENT_BEFORE}" ] && ! echo "${EVENT_BEFORE}" | grep -qE '^0+$' \
               && git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null; then base="${EVENT_BEFORE}"
          elif git rev-parse -q --verify HEAD~1 >/dev/null; then base="HEAD~1"
          fi
          echo "whitespace base: ${base:-none}"
          STATIC_BASE="${base:-HEAD}" bash tests/static-checks.sh

  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout easy-vless
        uses: actions/checkout@v4

      - name: Check tag against package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          v="$(sed -n 's/^PKG_VERSION:=//p' Makefile)"
          r="$(sed -n 's/^PKG_RELEASE:=//p' Makefile)"
          it="$(sed -n 's/^EV_TAG="\(.*\)"$/\1/p' scripts/install.sh)"
          iv="$(sed -n 's/^EV_VERSION="\(.*\)"$/\1/p' scripts/install.sh)"
          case "${tag}" in
            "v${v}"|"v${v}-r${r}") ;;
            *) echo "::error::tag ${tag} does not match the package version ${v}-r${r} (expected v${v} or v${v}-r${r})"; exit 1 ;;
          esac
          [ "${it}" = "${tag}" ] || { echo "::error::scripts/install.sh EV_TAG=${it} does not match tag ${tag}"; exit 1; }
          [ "${iv}" = "${v}-r${r}" ] || { echo "::error::scripts/install.sh EV_VERSION=${iv} does not match ${v}-r${r}"; exit 1; }
          echo "tag ${tag} matches ${v}-r${r}"

      - name: Install host build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file wget rsync unzip python3 quilt \
            libncurses-dev zlib1g-dev

      - name: Resolve and download official OpenWrt SDK
        run: |
          set -euxo pipefail
          BASE_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}"
          curl -fsSL -o sha256sums "${BASE_URL}/sha256sums"

          SDK_LINE="$(grep -E '[[:space:]]\*?openwrt-sdk-.*\.tar\.(xz|zst)$' sha256sums | head -n1 || true)"
          if [ -z "$SDK_LINE" ]; then
            echo "::error::Could not find an openwrt-sdk-*.tar.{xz,zst} entry in ${BASE_URL}/sha256sums"
            exit 1
          fi
          SDK_FILE="$(echo "$SDK_LINE" | awk '{print $2}' | sed 's/^\*//')"
          echo "Resolved SDK file: ${SDK_FILE}"
          echo "SDK_FILE=${SDK_FILE}" >> "$GITHUB_ENV"

          curl -fsSL -o "${SDK_FILE}" "${BASE_URL}/${SDK_FILE}"

          echo "Verifying sha256..."
          grep -F "${SDK_FILE}" sha256sums | sha256sum -c -

      - name: Extract SDK
        run: |
          set -euxo pipefail
          mkdir -p sdk
          tar -xf "${SDK_FILE}" -C sdk --strip-components=1

      - name: Set up package feeds (official + geoview-only third-party)
        working-directory: sdk
        run: |
          set -euxo pipefail

          echo "----- feeds.conf.default (official, shipped by the SDK) -----"
          cat feeds.conf.default
          echo "----------------------------------------------------------------"

          # Add the third-party PassWall packages feed *in addition to* the
          # official ones already listed above - pinned to a specific commit,
          # not "latest", for reproducibility. We only ever install a single
          # named package (geoview) from it below; sing-box/xray-core/etc.
          # are resolved from the official feeds already listed in
          # feeds.conf.default, not from this feed.
          echo "src-git passwall_packages ${PASSWALL_PACKAGES_FEED_URL}^${PASSWALL_PACKAGES_FEED_COMMIT}" >> feeds.conf.default

          ./scripts/feeds update -a

          # Install only the specific packages easy-vless actually DEPENDS
          # on from each official feed, instead of every package in it.
          # `feeds install -a` symlinks (and therefore Kconfig-scans at
          # `make defconfig` time) every package the feed defines, which
          # pulled in unrelated, unwanted default-enabled packages (e.g.
          # kmod-tcp-bbr, kmod-tcp-hybla) that easy-vless does not depend
          # on at all. `nftables`, `kmod-nft-tproxy`, `kmod-nft-socket`,
          # `kmod-nft-nat`, `lua`, `libuci-lua`, `ip-full`, `resolveip` and
          # `openssl-util` are base-tree OpenWrt packages (package/network,
          # package/system, package/utils, package/libs) - they ship with
          # the SDK itself and need no feeds install at all. Nothing in
          # easy-vless's DEPENDS comes from the routing/telephony feeds,
          # so those feeds are not installed from at all anymore.
          #
          # "packages" feed: coreutils (its Makefile also defines
          # coreutils-base64/-nohup/-timeout, installed as part of the
          # same source dir), curl, v2ray-geoip (its Makefile also defines
          # v2ray-geosite), lyaml, sing-box, xray-core.
          ./scripts/feeds install -p packages \
            coreutils \
            curl \
            v2ray-geoip \
            v2ray-geosite \
            lyaml \
            sing-box \
            xray-core

          # "luci" feed: only the two LuCI support libraries easy-vless
          # DEPENDS on.
          ./scripts/feeds install -p luci \
            luci-base \
            luci-compat \
            luci-lib-jsonc

          # From the third-party feed, install ONLY geoview - not `-a`, so we
          # never pull in that feed's own copies of sing-box/xray-core or any
          # other package we don't need.
          ./scripts/feeds install -p passwall_packages geoview

          # Confirm geoview really came from the third-party feed directory,
          # not silently shadowed by some future official-feed addition.
          test -L package/feeds/passwall_packages/geoview \
            || { echo "::error::geoview was not installed from the passwall_packages feed as expected"; exit 1; }
          if [ -e package/feeds/packages/net/geoview ] || [ -e package/feeds/luci/geoview ]; then
            echo "::error::geoview unexpectedly also exists in an official feed - re-check which one is actually selected"
            exit 1
          fi
          echo "Confirmed: geoview is sourced only from the passwall_packages feed."

          # The passwall_packages feed also ships its own copies of
          # sing-box, sing-box-tiny, xray-core and xray-plugin (confirmed
          # by inspecting the feed at the pinned commit). `feeds install
          # -p passwall_packages geoview` above requests ONLY geoview, but
          # feeds install recursively resolves a requested package's own
          # Build-Depends/Depends within the same feed, so this is a real
          # (if currently narrow) risk, not a theoretical one. If any of
          # these ever get symlinked from this feed too, the aggregate
          # package scan ends up with two Source-Makefiles both declaring
          # the same package name (e.g. "xray-core"), which produces a
          # structurally invalid, duplicated Kconfig symbol (reproduced
          # directly: a duplicated "config PACKAGE_xray-core" stanza) -
          # this is what caused CI run #1's "recursive dependency" /
          # "missing TITLE field" failures. sing-box/xray-core/xray-plugin
          # must come from the OFFICIAL feed only (already installed
          # above) - fail loudly instead of silently building against
          # whichever copy happened to win.
          for pkg in sing-box sing-box-tiny xray-core xray-plugin xray-example; do
            if [ -e "package/feeds/passwall_packages/$pkg" ]; then
              echo "::error::package/feeds/passwall_packages/$pkg exists - only geoview must ever be installed from the passwall_packages feed; sing-box/xray-core must come from the official feed"
              exit 1
            fi
          done
          echo "Confirmed: no sing-box/xray-core/xray-plugin leaked in from the passwall_packages feed."

      - name: Place easy-vless source into the SDK package tree
        run: |
          set -euxo pipefail
          mkdir -p sdk/package/easy-vless
          rsync -a --exclude='.git' --exclude='.github' --exclude='sdk' ./ sdk/package/easy-vless/
          test -f sdk/package/easy-vless/Makefile

      - name: Select the easy-vless packages in .config
        working-directory: sdk
        run: |
          set -euxo pipefail
          # The downloaded SDK's own .config only configures the
          # target/subtarget (mediatek/filogic/aarch64_cortex-a53) - no
          # package is selected by default, including ours (it didn't exist
          # in any feed until the previous step copied it in). Without this,
          # `make defconfig` leaves CONFIG_PACKAGE_easy-vless unset, and
          # package-pack.mk's own selection gate
          # (`ifneq ($(CONFIG_PACKAGE_$(1))$(DEVELOPER),)`) then silently
          # skips building every one of our three .ipk - the compile step
          # would exit 0 having produced nothing. Appending is safe: these
          # are new symbols not already present in the shipped .config.
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_easy-vless=y
          CONFIG_PACKAGE_easy-vless-sing-box=y
          CONFIG_PACKAGE_easy-vless-xray=y
          CONFIG_PACKAGE_luci-app-easy-vless=y
          CONFIG_PACKAGE_easy-vless-geodata=y
          EOF

      - name: Build easy-vless, easy-vless-sing-box, easy-vless-xray, luci-app-easy-vless .ipk
        working-directory: sdk
        run: |
          set -euxo pipefail
          # make defconfig: (re)generates tmp/.packagedeps and fills in the
          # rest of .config from the Kconfig defaults. This step alone never
          # compiles anything (see the pipeline comment at the top of this
          # file) - it's a fast Kconfig scan, not the CI bottleneck.
          make defconfig

          # Standalone, non-top-level invocation of our own package's
          # Makefile - see the pipeline comment at the top of this file for
          # why this (not `make package/easy-vless/{clean,compile}`) is the
          # correct mechanism here. TOPDIR must be passed explicitly (it is
          # normally supplied by the top-level Makefile when it recurses into
          # a package directory); rules.mk derives everything else (ARCH,
          # STAGING_DIR, the cross toolchain PATH, etc.) from TOPDIR + the
          # .config produced above. This still runs the real, unmodified
          # package.mk/package-pack.mk/ipkg-build machinery for our own three
          # packages - it does not build sing-box, xray-core, geoview,
          # v2ray-geoip, v2ray-geosite, kmod-*, or any other DEPENDS; those
          # exist here only as package metadata (opkg Depends: entries).
          make -C package/easy-vless TOPDIR="$(pwd)" clean compile V=s -j"$(nproc)"

      - name: Locate and verify the easy-vless (core) .ipk
        working-directory: sdk
        run: |
          set -euxo pipefail

          IPK="$(find bin -type f -name 'easy-vless_*.ipk' | head -n1)"
          if [ -z "${IPK}" ]; then
            echo "::error::No easy-vless_*.ipk found under sdk/bin after build"
            find bin -maxdepth 4 -type d 2>/dev/null || true
            exit 1
          fi
          echo "Found ipk: ${IPK}"

          case "${IPK}" in
            *"${EXPECTED_PKGARCH}"*) : ;;
            *)
              echo "::error::.ipk was not produced under the expected ${EXPECTED_PKGARCH} SDK output tree: ${IPK}"
              exit 1
              ;;
          esac

          echo "IPK_PATH_CORE=sdk/${IPK}" >> "$GITHUB_ENV"

          rm -rf /tmp/ipk-verify-core
          mkdir -p /tmp/ipk-verify-core
          cp "${IPK}" /tmp/ipk-verify-core/pkg.ipk
          cd /tmp/ipk-verify-core
          # OpenWrt's .ipk is a gzip-compressed GNU tar archive of
          # debian-binary/data.tar.gz/control.tar.gz (see scripts/ipkg-build
          # in the OpenWrt tree) - it is NOT an ar archive despite the
          # superficial resemblance to Debian's .deb format, so `ar x` fails
          # with "file format not recognized". Use tar, like opkg itself does.
          tar -xzf pkg.ipk
          test -f control.tar.gz
          test -f data.tar.gz
          tar -xzf control.tar.gz
          test -f control

          echo "----- control file (easy-vless) -----"
          cat control
          echo "--------------------------------------"

          # 1. Package name matches the core package exactly (anchored, so it
          #    cannot accidentally match easy-vless-sing-box/easy-vless-xray).
          grep -qE '^Package:[[:space:]]*easy-vless[[:space:]]*$' control \
            || { echo "::error::control file Package: field is not 'easy-vless'"; exit 1; }

          # 2. Architecture. The Makefile sets PKGARCH:=all because this package
          #    ships only shell/Lua sources and configs - no compiled binaries -
          #    so "all" is the correct value here, not aarch64_cortex-a53 itself.
          #    aarch64_cortex-a53 correspondence was already checked above via
          #    the SDK output path the .ipk was built into.
          grep -qE '^Architecture:[[:space:]]*all[[:space:]]*$' control \
            || { echo "::error::control file Architecture: field is not 'all' (unexpected for a PKGARCH:=all package)"; exit 1; }

          # 3. Depends: check in isolation (not the whole control file), since
          #    the Package: line for the sub-packages contains "easy-vless" /
          #    "sing-box"/"xray"-like substrings too and would give false
          #    positives if we grepped the whole file.
          DEPENDS_LINE="$(grep '^Depends:' control || true)"
          echo "Depends: ${DEPENDS_LINE}"

          for dep in nftables lua luci-compat openssl-util lyaml \
                     kmod-nft-tproxy kmod-nft-socket; do
            echo "${DEPENDS_LINE}" | grep -q "${dep}" \
              || { echo "::error::expected core dependency '${dep}' missing from control file Depends:"; exit 1; }
          done

          # 3a. Geo data is optional (easy-vless-geodata): core must be
          #     installable from the official feeds only.
          for forbidden in geoview v2ray-geoip v2ray-geosite; do
            if echo "${DEPENDS_LINE}" | grep -qw "${forbidden}"; then
              echo "::error::easy-vless (core) Depends: unexpectedly contains '${forbidden}' - geo data lives in easy-vless-geodata"
              exit 1
            fi
          done

          # 3b. Backend split: the core package must NOT depend on either
          #     engine - each engine's DEPENDS lives in its own sub-package.
          for forbidden in sing-box xray-core; do
            if echo "${DEPENDS_LINE}" | grep -qw "${forbidden}"; then
              echo "::error::easy-vless (core) Depends: unexpectedly contains '${forbidden}' - engine DEPENDS must live only in easy-vless-sing-box/easy-vless-xray"
              exit 1
            fi
          done

          # 4. Content: the core package must ship neither engine's util_*.lua.
          tar -xzf data.tar.gz
          for f in usr/share/easy_vless/app.sh usr/share/easy_vless/direct_ip usr/share/easy_vless/lease2hosts.sh \
                   usr/share/easy_vless/resources/manifest.json usr/share/easy_vless/resources/domains/proxy.txt usr/share/easy_vless/resources/domains/russia.txt \
                   usr/share/easy_vless/subscribe.lua lib/upgrade/keep.d/easy-vless \
                   usr/share/easy_vless/diag.lua usr/share/easy_vless/backup.lua usr/share/easy_vless/update.sh \
                   usr/lib/lua/luci/easy_vless/nodes.lua usr/lib/lua/luci/easy_vless/explain.lua \
                   usr/lib/lua/luci/easy_vless/diagnose.lua usr/lib/lua/luci/easy_vless/transfer.lua; do
            test -f "./$f" || { echo "::error::easy-vless (core) does not ship $f"; exit 1; }
          done
          for forbidden_file in usr/lib/lua/luci/easy_vless/util_sing-box.lua \
                                usr/lib/lua/luci/easy_vless/util_xray.lua; do
            if find . -path "*${forbidden_file}" | grep -q .; then
              echo "::error::easy-vless (core) unexpectedly ships ${forbidden_file} - it must only be in the matching backend sub-package"
              exit 1
            fi
          done

          # 5. Prepared resources: reference/domains and the package source
          #    lists match tests/resources.sha256, and the packaged
          #    manifest/lists are byte-identical to the source and reference.
          (cd "${GITHUB_WORKSPACE}" && sha256sum -c tests/resources.sha256) \
            || { echo "::error::source resource lists differ from tests/resources.sha256"; exit 1; }
          grep '  root/' "${GITHUB_WORKSPACE}/tests/resources.sha256" | sed 's#  root/#  ./#' | sha256sum -c - \
            || { echo "::error::packaged resource lists differ from the reference hashes"; exit 1; }
          for f in manifest.json domains/proxy.txt domains/russia.txt; do
            cmp "./usr/share/easy_vless/resources/${f}" "${GITHUB_WORKSPACE}/root/usr/share/easy_vless/resources/${f}" \
              || { echo "::error::packaged resources/${f} differs from the source file"; exit 1; }
          done
          for f in proxy.txt russia.txt; do
            cmp "./usr/share/easy_vless/resources/domains/${f}" "${GITHUB_WORKSPACE}/reference/domains/${f}" \
              || { echo "::error::packaged resources/domains/${f} differs from reference/domains/${f}"; exit 1; }
          done

          echo "All easy-vless (core) .ipk checks passed."

      - name: Locate and verify the easy-vless-sing-box .ipk
        working-directory: sdk
        run: |
          set -euxo pipefail

          IPK="$(find bin -type f -name 'easy-vless-sing-box_*.ipk' | head -n1)"
          if [ -z "${IPK}" ]; then
            echo "::error::No easy-vless-sing-box_*.ipk found under sdk/bin after build"
            find bin -maxdepth 4 -type d 2>/dev/null || true
            exit 1
          fi
          echo "Found ipk: ${IPK}"

          case "${IPK}" in
            *"${EXPECTED_PKGARCH}"*) : ;;
            *)
              echo "::error::.ipk was not produced under the expected ${EXPECTED_PKGARCH} SDK output tree: ${IPK}"
              exit 1
              ;;
          esac

          echo "IPK_PATH_SINGBOX=sdk/${IPK}" >> "$GITHUB_ENV"

          rm -rf /tmp/ipk-verify-singbox
          mkdir -p /tmp/ipk-verify-singbox
          cp "${IPK}" /tmp/ipk-verify-singbox/pkg.ipk
          cd /tmp/ipk-verify-singbox
          tar -xzf pkg.ipk
          test -f control.tar.gz
          test -f data.tar.gz
          tar -xzf control.tar.gz
          test -f control

          echo "----- control file (easy-vless-sing-box) -----"
          cat control
          echo "------------------------------------------------"

          grep -qE '^Package:[[:space:]]*easy-vless-sing-box[[:space:]]*$' control \
            || { echo "::error::control file Package: field is not 'easy-vless-sing-box'"; exit 1; }

          grep -qE '^Architecture:[[:space:]]*all[[:space:]]*$' control \
            || { echo "::error::control file Architecture: field is not 'all' (unexpected for a PKGARCH:=all package)"; exit 1; }

          DEPENDS_LINE="$(grep '^Depends:' control || true)"
          echo "Depends: ${DEPENDS_LINE}"

          echo "${DEPENDS_LINE}" | grep -qw "easy-vless" \
            || { echo "::error::easy-vless-sing-box Depends: does not contain 'easy-vless'"; exit 1; }
          echo "${DEPENDS_LINE}" | grep -qw "sing-box" \
            || { echo "::error::easy-vless-sing-box Depends: does not contain 'sing-box'"; exit 1; }

          tar -xzf data.tar.gz
          find . -path '*usr/lib/lua/luci/easy_vless/util_sing-box.lua' | grep -q . \
            || { echo "::error::easy-vless-sing-box does not ship util_sing-box.lua"; exit 1; }
          find . -path '*usr/share/easy_vless/clash_api.lua' | grep -q . \
            || { echo "::error::easy-vless-sing-box does not ship clash_api.lua"; exit 1; }
          if find . -path '*usr/lib/lua/luci/easy_vless/util_xray.lua' | grep -q .; then
            echo "::error::easy-vless-sing-box unexpectedly ships util_xray.lua - it must only be in easy-vless-xray"
            exit 1
          fi

          echo "All easy-vless-sing-box .ipk checks passed."

      - name: Locate and verify the easy-vless-xray .ipk
        working-directory: sdk
        run: |
          set -euxo pipefail

          IPK="$(find bin -type f -name 'easy-vless-xray_*.ipk' | head -n1)"
          if [ -z "${IPK}" ]; then
            echo "::error::No easy-vless-xray_*.ipk found under sdk/bin after build"
            find bin -maxdepth 4 -type d 2>/dev/null || true
            exit 1
          fi
          echo "Found ipk: ${IPK}"

          case "${IPK}" in
            *"${EXPECTED_PKGARCH}"*) : ;;
            *)
              echo "::error::.ipk was not produced under the expected ${EXPECTED_PKGARCH} SDK output tree: ${IPK}"
              exit 1
              ;;
          esac

          echo "IPK_PATH_XRAY=sdk/${IPK}" >> "$GITHUB_ENV"

          rm -rf /tmp/ipk-verify-xray
          mkdir -p /tmp/ipk-verify-xray
          cp "${IPK}" /tmp/ipk-verify-xray/pkg.ipk
          cd /tmp/ipk-verify-xray
          tar -xzf pkg.ipk
          test -f control.tar.gz
          test -f data.tar.gz
          tar -xzf control.tar.gz
          test -f control

          echo "----- control file (easy-vless-xray) -----"
          cat control
          echo "--------------------------------------------"

          grep -qE '^Package:[[:space:]]*easy-vless-xray[[:space:]]*$' control \
            || { echo "::error::control file Package: field is not 'easy-vless-xray'"; exit 1; }

          grep -qE '^Architecture:[[:space:]]*all[[:space:]]*$' control \
            || { echo "::error::control file Architecture: field is not 'all' (unexpected for a PKGARCH:=all package)"; exit 1; }

          DEPENDS_LINE="$(grep '^Depends:' control || true)"
          echo "Depends: ${DEPENDS_LINE}"

          echo "${DEPENDS_LINE}" | grep -qw "easy-vless" \
            || { echo "::error::easy-vless-xray Depends: does not contain 'easy-vless'"; exit 1; }
          # The real package name is "xray-core" (see the Makefile comment) -
          # not "xray". Check for the exact real name here.
          echo "${DEPENDS_LINE}" | grep -qw "xray-core" \
            || { echo "::error::easy-vless-xray Depends: does not contain 'xray-core'"; exit 1; }

          tar -xzf data.tar.gz
          find . -path '*usr/lib/lua/luci/easy_vless/util_xray.lua' | grep -q . \
            || { echo "::error::easy-vless-xray does not ship util_xray.lua"; exit 1; }
          if find . -path '*usr/lib/lua/luci/easy_vless/util_sing-box.lua' | grep -q .; then
            echo "::error::easy-vless-xray unexpectedly ships util_sing-box.lua - it must only be in easy-vless-sing-box"
            exit 1
          fi

          echo "All easy-vless-xray .ipk checks passed."

      - name: Locate and verify the luci-app-easy-vless .ipk
        working-directory: sdk
        run: |
          set -euxo pipefail

          IPK="$(find bin -type f -name 'luci-app-easy-vless_*.ipk' | head -n1)"
          if [ -z "${IPK}" ]; then
            echo "::error::No luci-app-easy-vless_*.ipk found under sdk/bin after build"
            find bin -maxdepth 4 -type d 2>/dev/null || true
            exit 1
          fi
          echo "Found ipk: ${IPK}"
          echo "IPK_PATH_LUCI=sdk/${IPK}" >> "$GITHUB_ENV"

          rm -rf /tmp/ipk-verify-luci
          mkdir -p /tmp/ipk-verify-luci
          cp "${IPK}" /tmp/ipk-verify-luci/pkg.ipk
          cd /tmp/ipk-verify-luci
          tar -xzf pkg.ipk
          tar -xzf control.tar.gz
          echo "----- control file (luci-app-easy-vless) -----"
          cat control
          echo "-----------------------------------------------"

          grep -qE '^Package:[[:space:]]*luci-app-easy-vless[[:space:]]*$' control \
            || { echo "::error::control file Package: field is not 'luci-app-easy-vless'"; exit 1; }
          grep -qE '^Architecture:[[:space:]]*all[[:space:]]*$' control \
            || { echo "::error::control file Architecture: field is not 'all'"; exit 1; }
          DEPENDS_LINE="$(grep '^Depends:' control || true)"
          for dep in easy-vless luci-base rpcd; do
            echo "${DEPENDS_LINE}" | grep -qw "${dep}" \
              || { echo "::error::luci-app-easy-vless Depends: does not contain '${dep}'"; exit 1; }
          done
          for forbidden in sing-box xray-core; do
            if echo "${DEPENDS_LINE}" | grep -qw "${forbidden}"; then
              echo "::error::luci-app-easy-vless must not depend on a backend engine (${forbidden})"
              exit 1
            fi
          done
          test -x postinst || { echo "::error::luci-app-easy-vless has no executable postinst (rpcd reload)"; exit 1; }

          tar -xzf data.tar.gz
          for f in \
            ./www/luci-static/resources/view/easy_vless/main.js \
            ./www/luci-static/resources/view/easy_vless/servers.js \
            ./www/luci-static/resources/view/easy_vless/rules.js \
            ./www/luci-static/resources/view/easy_vless/settings.js \
            ./www/luci-static/resources/view/easy_vless/wizard.js \
            ./www/luci-static/resources/view/easy_vless/diagnostics.js \
            ./www/luci-static/resources/view/easy_vless/maintenance.js \
            ./www/luci-static/resources/easy_vless/common.js \
            ./www/luci-static/resources/easy_vless/rulecheck.js \
            ./usr/share/luci/menu.d/luci-app-easy-vless.json \
            ./usr/share/rpcd/acl.d/luci-app-easy-vless.json \
            ./usr/lib/lua/luci/i18n/easy-vless.ru.lmo \
            ./usr/libexec/rpcd/luci.easy_vless; do
            test -f "$f" || { echo "::error::luci-app-easy-vless does not ship $f"; exit 1; }
          done
          # the shipped catalog is exactly scripts/po2lmo.py of luci/po/ru
          python3 "$GITHUB_WORKSPACE/scripts/po2lmo.py" "$GITHUB_WORKSPACE/luci/po/ru/easy-vless.po" /tmp/ru-check.lmo
          cmp /tmp/ru-check.lmo ./usr/lib/lua/luci/i18n/easy-vless.ru.lmo \
            || { echo "::error::easy-vless.ru.lmo differs from luci/po/ru/easy-vless.po"; exit 1; }
          test -x ./usr/libexec/rpcd/luci.easy_vless \
            || { echo "::error::rpcd plugin is not executable"; exit 1; }
          if find . -path '*usr/share/easy_vless*' -o -path '*util_sing-box.lua' -o -path '*util_xray.lua' | grep -q .; then
            echo "::error::luci-app-easy-vless unexpectedly ships runtime files"
            exit 1
          fi
          echo "All luci-app-easy-vless .ipk checks passed."

      - name: Locate and verify the easy-vless-geodata .ipk
        working-directory: sdk
        run: |
          set -euxo pipefail
          IPK="$(find bin -type f -name 'easy-vless-geodata_*.ipk' | head -n1)"
          if [ -z "${IPK}" ]; then
            echo "::error::No easy-vless-geodata_*.ipk found under sdk/bin after build"
            exit 1
          fi
          echo "IPK_PATH_GEODATA=sdk/${IPK}" >> "$GITHUB_ENV"
          rm -rf /tmp/ipk-verify-geodata
          mkdir -p /tmp/ipk-verify-geodata
          cp "${IPK}" /tmp/ipk-verify-geodata/pkg.ipk
          cd /tmp/ipk-verify-geodata
          tar -xzf pkg.ipk
          tar -xzf control.tar.gz
          cat control
          DEPENDS_LINE="$(grep '^Depends:' control || true)"
          for dep in easy-vless geoview v2ray-geoip v2ray-geosite; do
            echo "${DEPENDS_LINE}" | grep -qw "${dep}" \
              || { echo "::error::easy-vless-geodata Depends: does not contain '${dep}'"; exit 1; }
          done
          echo "All easy-vless-geodata .ipk checks passed."

      - name: Report .ipk sizes
        working-directory: sdk
        run: |
          set -euo pipefail
          echo "| package | .ipk bytes | Installed-Size (bytes) |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|---:|" >> "$GITHUB_STEP_SUMMARY"
          for IPK in $(find bin -type f \( -name 'easy-vless*.ipk' -o -name 'luci-app-easy-vless_*.ipk' \) | sort); do
            d=$(mktemp -d)
            tar -xzf "$IPK" -C "$d"
            tar -xzf "$d/control.tar.gz" -C "$d"
            inst=$(awk '/^Installed-Size:/{print $2}' "$d/control")
            size=$(stat -c %s "$IPK")
            echo "$(basename "$IPK"): ${size} bytes, Installed-Size ${inst:-?}"
            echo "| $(basename "$IPK") | ${size} | ${inst:-?} |" >> "$GITHUB_STEP_SUMMARY"
            rm -rf "$d"
          done

      - name: Assemble dist/ (release packages + install.sh + SHA256SUMS)
        run: |
          set -euo pipefail
          rm -rf dist dist-optional
          mkdir -p dist dist-optional
          # Required release assets: the three standard packages and the
          # installer. sing-box-tiny is not bundled: install.sh installs it
          # from the router's own official OpenWrt feed.
          cp "${IPK_PATH_CORE}" "${IPK_PATH_SINGBOX}" "${IPK_PATH_LUCI}" dist/
          cp scripts/install.sh dist/install.sh
          # Optional packages (not part of the release assets / installer).
          cp "${IPK_PATH_XRAY}" "${IPK_PATH_GEODATA}" dist-optional/
          v="$(sed -n 's/^PKG_VERSION:=//p' Makefile)-r$(sed -n 's/^PKG_RELEASE:=//p' Makefile)"
          for p in easy-vless easy-vless-sing-box luci-app-easy-vless; do
            test -f "dist/${p}_${v}_all.ipk" || { echo "::error::dist/${p}_${v}_all.ipk missing (name/version mismatch)"; exit 1; }
          done
          (cd dist && sha256sum *.ipk install.sh > SHA256SUMS && sha256sum -c SHA256SUMS)
          (cd dist-optional && sha256sum *.ipk > SHA256SUMS)
          echo "EV_PKG_VERSION=${v}" >> "$GITHUB_ENV"
          ls -l dist dist-optional
          cat dist/SHA256SUMS

      - name: Upload dist artifact (release packages)
        uses: actions/upload-artifact@v4
        with:
          name: easy-vless-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload optional packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: easy-vless-optional
          path: dist-optional/
          if-no-files-found: error
          retention-days: 30

      - name: Upload easy-vless (core) .ipk artifact
        uses: actions/upload-artifact@v4
        with:
          name: easy-vless-ipk
          path: ${{ env.IPK_PATH_CORE }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload easy-vless-sing-box .ipk artifact
        uses: actions/upload-artifact@v4
        with:
          name: easy-vless-sing-box-ipk
          path: ${{ env.IPK_PATH_SINGBOX }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload easy-vless-xray .ipk artifact
        uses: actions/upload-artifact@v4
        with:
          name: easy-vless-xray-ipk
          path: ${{ env.IPK_PATH_XRAY }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload luci-app-easy-vless .ipk artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-easy-vless-ipk
          path: ${{ env.IPK_PATH_LUCI }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload easy-vless-geodata .ipk artifact
        uses: actions/upload-artifact@v4
        with:
          name: easy-vless-geodata-ipk
          path: ${{ env.IPK_PATH_GEODATA }}
          if-no-files-found: error
          retention-days: 14

  # One job per real OpenWrt rootfs image (release/target/architecture) and
  # test group. x86-64 runs natively; the other architectures run their own
  # OpenWrt userland through QEMU user emulation (binfmt) - the binaries,
  # package feeds and "uname -m" are those of that architecture, nothing is
  # renamed or faked. The Easy VLESS packages are the same "all" packages
  # built above for every target.
  runtime-tests:
    # full CI only: pull requests and workflow_dispatch (not a push to main,
    # not a tag: that tree already passed this matrix, release checks it)
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')) }}
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ matrix.target.platform == '' && 60 || 150 }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: x86-64 24.10.3,               image: "openwrt/rootfs:x86-64-24.10.3",         platform: "",                                arch: x86_64 }
          - { name: x86-64 24.10.8,               image: "openwrt/rootfs:x86-64-24.10.8",         platform: "",                                arch: x86_64 }
          - { name: armsr-armv8 aarch64 24.10.3,  image: "openwrt/rootfs:armsr-armv8-24.10.3",    platform: "linux/aarch64_generic",           arch: aarch64_generic }
          - { name: armsr-armv7 ARMv7 24.10.3,    image: "openwrt/rootfs:armsr-armv7-24.10.3",    platform: "linux/arm_cortex-a15_neon-vfpv4", arch: arm_cortex-a15_neon-vfpv4 }
          - { name: mvebu-cortexa9 ARMv7 24.10.3, image: "openwrt/rootfs:mvebu-cortexa9-24.10.3", platform: "linux/arm_cortex-a9_vfpv3-d16",   arch: arm_cortex-a9_vfpv3-d16 }
          - { name: malta-be MIPS BE 24.10.3,     image: "openwrt/rootfs:malta-be-24.10.3",       platform: "linux/mips_24kc",                 arch: mips_24kc }
        group:
          - { name: runtime+sysreq, runtime: "1", wizard: "0", scenarios: "preflight sysreq ram128 ram256 smallspace tr3000" }
          - { name: install,        runtime: "0", wizard: "0", scenarios: "online rollback upgrade" }
          - { name: bootstrap,      runtime: "0", wizard: "0", scenarios: "bootstrap tlsboot" }
          - { name: wizard,         runtime: "0", wizard: "1", scenarios: "" }
    name: runtime-tests (${{ matrix.target.name }}, ${{ matrix.group.name }})
    env:
      OPENWRT_ROOTFS_IMAGE: ${{ matrix.target.image }}
      DOCKER_PLATFORM: ${{ matrix.target.platform }}
    steps:
      - name: Checkout easy-vless
        uses: actions/checkout@v4

      - name: QEMU user emulation (binfmt) for ${{ matrix.target.arch }}
        if: matrix.target.platform != '' && !startsWith(matrix.target.arch, 'mips')
        uses: docker/setup-qemu-action@v3

      # tonistiigi/binfmt (setup-qemu-action) has no 32-bit MIPS emulator;
      # Ubuntu's qemu-user-static registers qemu-mips with the "F" flag
      # (the interpreter is opened on the host, usable inside containers)
      - name: QEMU user emulation (binfmt) for ${{ matrix.target.arch }} (qemu-user-static)
        if: startsWith(matrix.target.arch, 'mips')
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static binfmt-support
          cat /proc/sys/fs/binfmt_misc/qemu-mips
          grep -q "^flags: .*F" /proc/sys/fs/binfmt_misc/qemu-mips

      - name: Pull the rootfs image and verify its architecture
        run: |
          set -euo pipefail
          p=()
          [ -z "${DOCKER_PLATFORM}" ] || p=(--platform "${DOCKER_PLATFORM}")
          docker pull "${p[@]}" "${OPENWRT_ROOTFS_IMAGE}"
          out="$(docker run --rm "${p[@]}" "${OPENWRT_ROOTFS_IMAGE}" /bin/ash -c '. /etc/openwrt_release; echo "$DISTRIB_RELEASE $DISTRIB_TARGET $DISTRIB_ARCH $(uname -m)"')"
          echo "OpenWrt release/target/architecture/kernel: $out"
          file_out="$(docker create "${p[@]}" "${OPENWRT_ROOTFS_IMAGE}")"
          docker cp "$file_out:/bin/busybox" /tmp/busybox >/dev/null 2>&1 || docker cp -L "$file_out:/bin/busybox" /tmp/busybox
          docker rm "$file_out" >/dev/null
          file -L /tmp/busybox
          echo "$out" | grep -q " ${{ matrix.target.arch }} " || { echo "unexpected architecture"; exit 1; }

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: easy-vless-dist
          path: dist

      - name: Installer + subscription tests
        if: matrix.group.runtime == '1'
        run: |
          set -euo pipefail
          # The packages are architecture "all"; the container uses the
          # official feeds of its own release/target/architecture, so
          # install.sh exercises the real opkg flow (sing-box-tiny from the
          # feed, dnsmasq -> dnsmasq-full replacement, SHA256SUMS).
          # There is no procd in the container (service restarts only warn):
          # the script starts ubusd and rpcd itself, verifies ubus/uci/rpcd
          # before and after the installation, then runs the tests unchanged.
          p=()
          [ -z "${DOCKER_PLATFORM}" ] || p=(--platform "${DOCKER_PLATFORM}")
          docker run --rm "${p[@]}" -v "${GITHUB_WORKSPACE}:/w" "${OPENWRT_ROOTFS_IMAGE}" \
            /bin/ash /w/tests/ci/openwrt-runtime-tests.sh

      - name: Installer scenarios (${{ matrix.group.scenarios }})
        if: matrix.group.scenarios != ''
        run: |
          set -euo pipefail
          # preflight:  detection, checks, clock, CA/TLS, feeds of another
          #             architecture/target/release, download/checksum errors
          # sysreq:     flash/RAM layouts of real routers (TR3000 v1, 64 MB
          #             NAND, 16 MB NOR, x86 disks, 128/256 MB RAM)
          # ram128/256: real memory limit of the container (docker --memory)
          # smallspace: real 16 MB /overlay (tmpfs) -> refused
          # tr3000:     TR3000 v1 layout, real 40 MB /overlay -> installs
          # online:     HTTPS release download, repeated run, architecture of
          #             every installed package, preserved config
          # rollback:   dnsmasq-full failure and interruption -> old dnsmasq back
          # upgrade:    published 0.5.1-r1 -> 0.5.1-r2 (from GitHub) -> this
          #             build, uninstall, reinstall
          # bootstrap:  README manual opkg bootstrap and install.sh --bootstrap-opkg
          # tlsboot:    no TLS backend / CA bundle / opkg: offline install from a
          #             signature-verified local copy of the base feed
          bash tests/ci/installer-tests.sh dist ${{ matrix.group.scenarios }}

      - name: Playwright (headless Chromium) for the LuCI wizard test
        if: matrix.group.wizard == '1' && matrix.target.platform == ''
        run: |
          set -euo pipefail
          python3 -m pip install --user playwright==1.47.0
          python3 -m playwright install --with-deps chromium

      # First Run Wizard: backend (ubus/rpcd calls of the wizard, a real VLESS
      # server in a second container, service start with nftables in the
      # router container) on every target; the LuCI wizard in a real browser
      # on x86-64 (tests/ci/wizard-tests.sh)
      - name: First Run Wizard tests
        if: matrix.group.wizard == '1'
        env:
          WIZARD_E2E: ${{ matrix.target.platform == '' && '1' || '0' }}
          SHOTS: ${{ github.workspace }}/wizard-shots
        run: bash tests/ci/wizard-tests.sh dist

      - name: Upload wizard screenshots
        if: always() && matrix.group.wizard == '1' && matrix.target.platform == ''
        uses: actions/upload-artifact@v4
        with:
          name: wizard-screenshots-${{ strategy.job-index }}
          path: wizard-shots/
          if-no-files-found: ignore
          retention-days: 14

  # Real flash: the runner kernel simulates NAND chips (nandsim) with the
  # TR3000 v1 partition layout, UBI and a real UBIFS overlay.
  ubifs:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')) }}
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout easy-vless
        uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: easy-vless-dist
          path: dist

      - name: Kernel modules (nandsim, UBI, UBIFS) and mtd-utils
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mtd-utils "linux-modules-extra-$(uname -r)"
          uname -r
          for m in nandsim ubi ubifs; do modinfo -n "$m"; done

      - name: UBIFS / flash tests
        run: sudo bash tests/ci/ubifs-tests.sh dist

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout easy-vless
        uses: actions/checkout@v4

      # runtime-tests and ubifs do not run for tags: a release is only drafted
      # for a tree that already passed the full CI in another run of this
      # workflow (its pull request head - the merge commit of an up-to-date
      # PR has the same tree - or workflow_dispatch) - every one of its
      # checks, build, runtime-tests (the whole matrix, Wizard e2e included)
      # and ubifs jobs successful.
      - name: Require a successful full CI run of the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/actions"
          tree="$(git rev-parse HEAD^{tree})"
          found=""
          for id in $(gh api "${api}/workflows/build.yml/runs?status=success&per_page=100" \
                        --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID} and .head_commit.tree_id == \"${tree}\") | .id"); do
            # <jobs> <successful jobs> <runtime-tests jobs> <ubifs jobs>
            read -r n ok rt ub < <(gh api "${api}/runs/${id}/jobs?per_page=100" --jq '
              [.jobs[] | select(.name == "checks" or .name == "build" or .name == "ubifs" or (.name | startswith("runtime-tests ")))]
              | "\(length) \([.[] | select(.conclusion == "success")] | length) \([.[] | select(.name | startswith("runtime-tests "))] | length) \([.[] | select(.name == "ubifs")] | length)"')
            echo "run ${id}: ${ok}/${n} jobs successful, runtime-tests: ${rt}, ubifs: ${ub}"
            if [ "${n}" -gt 0 ] && [ "${ok}" = "${n}" ] && [ "${rt}" -gt 0 ] && [ "${ub}" = 1 ]; then
              found="${id}"
              break
            fi
          done
          if [ -z "${found}" ]; then
            echo "::error::no successful full CI run of this workflow for the tree ${tree} of ${GITHUB_SHA} (checks, build, all runtime-tests, ubifs): run the workflow (workflow_dispatch) on main for this commit before tagging"
            exit 1
          fi
          echo "full CI of tree ${tree} (${GITHUB_SHA}): ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${found}"

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: easy-vless-dist
          path: dist

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          v="$(sed -n 's/^PKG_VERSION:=//p' Makefile)-r$(sed -n 's/^PKG_RELEASE:=//p' Makefile)"
          (cd dist && sha256sum -c SHA256SUMS)
          cat > release-notes.md <<EOF
          Easy VLESS ${v} for OpenWrt 24.10 (opkg, fw4/nftables).

          Assets:
          - easy-vless_${v}_all.ipk, easy-vless-sing-box_${v}_all.ipk, luci-app-easy-vless_${v}_all.ipk
          - install.sh: installer (checks the router, installs sing-box-tiny from the official OpenWrt feed, optionally replaces dnsmasq with dnsmasq-full, verifies SHA256SUMS)
          - SHA256SUMS

          sing-box-tiny is not bundled; it comes from the router's official OpenWrt package feed.

          Before downloading on a router, the system time must be correct (HTTPS certificates cannot be verified with a clock that is behind): see the README section "HTTPS на новом роутере" (HTTPS on a new router).
          EOF
          gh release create "${tag}" dist/* --draft --verify-tag \
            --title "Easy VLESS ${v}" --notes-file release-notes.md
